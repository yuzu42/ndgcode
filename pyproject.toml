[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ndgcode"
dynamic = ["version"]
description = "The NextDraw Python API for GRBL G-code pen plotters such as the VigoTec VG-X4"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = ["pyserial>=3.4"]

[project.optional-dependencies]
# SVG plotting (plot_setup/plot_run) also needs the Bantam Tools NextDraw
# Python API, which is installed separately from Bantam Tools' download.

[project.scripts]
ndgcode = "ndgcode.cli:main"

[tool.setuptools]
packages = ["ndgcode"]

[tool.setuptools.dynamic]
version = { attr = "ndgcode.__version__" }
